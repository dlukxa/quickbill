name: Build Windows Release

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable Windows desktop support
        run: flutter config --enable-windows-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Build Windows Release
        env:
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"
          CL: "/D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS /arch:AVX"
        run: flutter build windows --release

      - name: Bundle sqlite3.dll and Visual C++ Redistributable
        shell: pwsh
        run: |
          # 1. Bundle sqlite3.dll
          if (!(Test-Path "windows\sqlite3.dll")) {
            Invoke-WebRequest -Uri "https://www.sqlite.org/2024/sqlite-dll-win-x64-3460100.zip" -OutFile "sqlite.zip"
            Expand-Archive -Path "sqlite.zip" -DestinationPath "windows" -Force
          }
          Copy-Item "windows\sqlite3.dll" "build\windows\x64\runner\Release\" -Force

          # 2. Bundle Visual C++ Runtime DLLs directly into Release folder so app is 100% self-contained
          $vsRedist = Get-ChildItem -Path "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Redist\MSVC" -Directory -ErrorAction SilentlyContinue
          if ($vsRedist) {
            $crtDir = Join-Path $vsRedist[0].FullName "x64\Microsoft.VC143.CRT"
            if (Test-Path $crtDir) {
              Copy-Item "$crtDir\*.dll" "build\windows\x64\runner\Release\" -Force
              Write-Host "Successfully bundled MSVC CRT DLLs from $crtDir"
            }
          }
          Copy-Item "C:\Windows\System32\msvcp140*.dll" "build\windows\x64\runner\Release\" -Force -ErrorAction SilentlyContinue
          Copy-Item "C:\Windows\System32\vcruntime140*.dll" "build\windows\x64\runner\Release\" -Force -ErrorAction SilentlyContinue
          Copy-Item "C:\Windows\System32\vcomp140*.dll" "build\windows\x64\runner\Release\" -Force -ErrorAction SilentlyContinue
          Copy-Item "C:\Windows\System32\concrt140*.dll" "build\windows\x64\runner\Release\" -Force -ErrorAction SilentlyContinue

          # 3. Download standalone vc_redist.x64.exe for Inno Setup installer
          Invoke-WebRequest -Uri "https://aka.ms/vs/17/release/vc_redist.x64.exe" -OutFile "vc_redist.x64.exe"
          Copy-Item "vc_redist.x64.exe" "build\windows\x64\runner\Release\" -Force

      - name: Build Windows Setup Installer (Inno Setup)
        shell: pwsh
        run: |
          if (!(Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y
          }
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" windows\installer\quickbill_setup.iss

      - name: Archive Windows Release
        shell: pwsh
        run: |
          Get-ChildItem -Path "build\windows\x64\runner\Release"
          Compress-Archive -Path "build\windows\x64\runner\Release\*" -DestinationPath "quickbill_windows_x64.zip" -Force

      - name: Upload Windows Setup Installer
        uses: actions/upload-artifact@v4
        with:
          name: QuickBill_Setup_x64
          path: build\windows_installer\QuickBill_Setup.exe

      - name: Upload Windows Portable Zip
        uses: actions/upload-artifact@v4
        with:
          name: quickbill-windows-x64
          path: quickbill_windows_x64.zip
