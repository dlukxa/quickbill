name: quickbill
description: Phone-based POS system for small shops
version: 1.0.6+10

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  
  # State Management
  flutter_riverpod: ^2.4.9
  fl_chart: ^0.66.0
  
  # Database (Offline Storage)
  sqflite: ^2.4.1
  sqlite3: ^2.4.6
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.1
  path: ^1.8.3
  
  # Cloud Sync
  firebase_core: ^3.1.0
  cloud_firestore: ^5.0.0
  firebase_auth: ^5.1.0
  google_sign_in: ^6.2.1
  firebase_storage: ^12.0.0
  firebase_remote_config: ^5.3.0
  
  # Barcode Scanning
  mobile_scanner: ^7.1.4
  flutter_blue_plus: ^1.32.0
  permission_handler: ^11.0.0
  
  # Receipt & Reports
  pdf: ^3.10.7
  printing: ^5.11.1
  share_plus: ^12.0.2
  blue_thermal_printer: ^1.2.3
  esc_pos_utils_plus: ^2.0.1
  
  # UI Components
  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.0
  
  # Utilities
  intl: ^0.20.2              # Date/number formatting
  uuid: ^4.2.2               # Generate unique IDs
  shared_preferences: ^2.2.2 # Simple storage
  connectivity_plus: ^5.0.2  # Network status
  file_picker: ^8.1.0        # File selection for restore
  url_launcher: ^6.3.2
  csv: ^6.0.0                # CSV generation and parsing
  crypto: ^3.0.7
  flutter_local_notifications: ^17.0.0
  qr_flutter: ^4.1.0
  image_picker: ^1.1.2
  camera: ^0.11.0+1
  google_mlkit_barcode_scanning: ^0.14.2
  google_mlkit_object_detection: ^0.15.1
  google_mlkit_text_recognition: ^0.15.1
  google_mlkit_commons: ^0.11.1
  image: ^4.1.3
  device_info_plus: ^12.3.0
  google_sign_in_ios: 5.8.0
  package_info_plus: ^9.0.0
  in_app_purchase: ^3.3.0
  in_app_purchase_android: ^0.5.0
  dio: ^5.4.0
  flutter_markdown: ^0.7.7+1
  firebase_crashlytics: ^4.3.10
  firebase_app_check: ^0.3.2+3
  table_calendar: ^3.2.0
  
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  sqflite_common_ffi: ^2.3.0
  change_app_package_name: ^1.5.0

flutter:
  generate: true
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/
    - assets/fonts/
